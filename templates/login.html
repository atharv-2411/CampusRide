{% extends "layout.html" %}

{% block title %}Login - CampusRide{% endblock %}

{% block content %}
<style>
.auth-page {
    min-height: calc(100vh - 64px);
    background: linear-gradient(135deg, #f5f4ff 0%, #ede9ff 100%);
    display: flex;
    align-items: center;
    padding: 3rem 0;
}

.auth-card {
    background: #fff;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 60px rgba(108,71,255,0.1);
    padding: 2.8rem 2.4rem;
    width: 100%;
    animation: fadeInUp 0.45s ease both;
}

.auth-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: #fff;
    margin: 0 auto 1.4rem;
    box-shadow: 0 8px 24px rgba(108,71,255,0.3);
}

.auth-title {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
    letter-spacing: -0.5px;
}

.auth-sub {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin-bottom: 2rem;
}

.auth-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem 0;
    color: var(--text-muted);
    font-size: 0.82rem;
}

.auth-divider::before,
.auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
}

.btn-auth {
    background: var(--primary-color);
    color: #fff;
    width: 100%;
    padding: 0.8rem;
    font-size: 0.97rem;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    transition: all 0.22s ease;
    margin-bottom: 1.2rem;
}

.btn-auth:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108,71,255,0.35);
    color: #fff;
}

.auth-footer-link {
    color: var(--primary-color);
    font-weight: 700;
    text-decoration: none;
}

.auth-footer-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>

<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="auth-card">
                    <div class="text-center">
                        <div class="auth-logo"><i class="fas fa-car"></i></div>
                        <h2 class="auth-title">Welcome back</h2>
                        <p class="auth-sub">Sign in to your CampusRide account</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">College Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="you@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-auth">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>

                    <div class="auth-divider">or</div>

                    <div class="text-center" style="font-size:0.92rem; color:var(--text-muted);">
                        Don't have an account?
                        <a href="{{ url_for('signup') }}" class="auth-footer-link ms-1">Create one</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
